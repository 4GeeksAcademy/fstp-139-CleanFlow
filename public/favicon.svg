<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="CleanFlow">
  <title>CleanFlow</title>

  <!-- Placa verde de marca. Sin ella, un isotipo de un solo color
       desaparece en las pestañas de los navegadores en modo oscuro. -->
